version: '1.0'
name: daily-course-push
displayName: 每日课程推送

triggers:
  schedule:
    - cron: '0 20 * * ?'

stages:
  - stage:
      name: push-stage
      displayName: 推送次日课程
      failFast: false
      trigger: auto
      steps:
        - step: build@python
          name: push-courses
          displayName: 推送课程到钉钉群
          pythonVersion: '3.9'
          commands:
            - python3 cloud_push.py
