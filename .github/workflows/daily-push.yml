name: 每日培训摘要推送

on:
  schedule:
    # UTC 14:00 = 北京时间 22:00，每天推送当日课程总结
    - cron: '0 14 * * *'
  workflow_dispatch:
    # 支持手动触发，测试用

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出版本
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发送钉钉摘要
        id: push
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET:  ${{ secrets.DINGTALK_SECRET }}
          PUSH_OUTCOME:     ${{ steps.push.outcome }}
        run: python cloud_push.py

      - name: 写入执行状态摘要
        if: always()
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="推送成功"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="推送失败，详见 GitHub Actions 日志"
          fi
          echo "推送状态: $STATUS_EMOJI $STATUS_TEXT"
